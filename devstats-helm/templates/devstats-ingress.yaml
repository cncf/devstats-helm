{{- $skipIngress := .Values.skipIngress -}}
{{- if not $skipIngress -}}

{{- $root := . -}}

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: '{{ .Values.namespace }}'
  name: devstats-ingress-1
  labels:
    name: devstats
    type: ingress
  annotations:
    #kubernetes.io/ingress.class: '{{ .Values.ingressClass }}'
    acme.cert-manager.io/http01-ingress-class: '{{ .Values.ingressClass }}'
    cert-manager.io/issuer: 'letsencrypt-{{ .Values.sslEnv }}'
spec:
  ingressClassName: '{{ .Values.ingressClass }}'
  tls:
{{- /* One tls entry (= one certificate secret) per domain, so a domain that cannot
      pass ACME validation can never block cert issuance for the other domains.
      The first in-range domain keeps the historical devstats-tls-1 name, additional
      domains get devstats-tls-1-<shortname>. */}}
{{ range $jndex, $_ := .Values.domains }}
{{- $dom := .name -}}
{{- $short := .shortname -}}
{{ if and (or (eq ($jndex|int) ($root.Values.indexDomainsFrom|int)) (gt ($jndex|int) ($root.Values.indexDomainsFrom|int))) (lt ($jndex|int) ($root.Values.indexDomainsTo|int)) }}
  - hosts:
    - {{ $dom }}
{{ range $index, $_ := $root.Values.projects }}
{{ if and (or (eq ($index|int) ($root.Values.indexIngressesFrom|int)) (gt ($index|int) ($root.Values.indexIngressesFrom|int))) (lt ($index|int) ($root.Values.indexIngressesTo|int)) }}
{{ if and (eq (.certNum|int) 1) (or (eq ($jndex|int) 0) (not .archived)) }}
{{ if gt ((index .domains $jndex)|int) 0 }}
    - {{ .url }}.{{ $dom }}
{{ end }}
{{ if and (not $root.Values.skipAliases) (eq ($jndex|int) 0) }}
{{ range $_, $alias := .aliases }}
    - {{ $alias }}
{{ end }}
{{ end }}
{{ end }}
{{ end }}
{{ end }}
    secretName: devstats-tls-1{{ if gt ($jndex|int) ($root.Values.indexDomainsFrom|int) }}-{{ $short }}{{ end }}
{{ end }}
{{ end }}
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: devstats-static-service-default
            port:
              number: 80
{{ range $jndex, $_ := .Values.domains }}
{{ if and (or (eq ($jndex|int) ($root.Values.indexDomainsFrom|int)) (gt ($jndex|int) ($root.Values.indexDomainsFrom|int))) (lt ($jndex|int) ($root.Values.indexDomainsTo|int)) }}
{{ if not $root.Values.skipAPIIngress }}
  - host: {{ .name }}
    http:
      paths:
      - path: '{{ $root.Values.apiPath }}'
        pathType: Prefix
        backend:
          service:
            name: '{{ $root.Values.apiServiceName }}'
            port:
              number: 80
{{ end }}
  - host: {{ .name }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: devstats-static-service-{{ .shortname }}
            port:
              number: 80
{{ end }}
{{ end }}
{{ range $jndex, $_ := .Values.domains }}
{{- $dom := .name -}}
{{ if and (or (eq ($jndex|int) ($root.Values.indexDomainsFrom|int)) (gt ($jndex|int) ($root.Values.indexDomainsFrom|int))) (lt ($jndex|int) ($root.Values.indexDomainsTo|int)) }}
{{ range $index, $_ := $root.Values.projects }}
{{ if and (or (eq ($index|int) ($root.Values.indexIngressesFrom|int)) (gt ($index|int) ($root.Values.indexIngressesFrom|int))) (lt ($index|int) ($root.Values.indexIngressesTo|int)) }}
{{ if and (eq (.certNum|int) 1) (or (eq ($jndex|int) 0) (not .archived)) }}
{{ if gt ((index .domains $jndex)|int) 0 }}
  - host: {{ .url }}.{{ $dom }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: devstats-service-{{ .proj }}
            port:
              number: 80
{{ end }}
{{ if not $root.Values.skipAliases }}
{{- $proj := .proj -}}
{{ range $_, $alias := .aliases }}
  - host: {{ $alias }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: devstats-service-{{ $proj }}
            port:
              number: 80
{{ end }}
{{ end }}
{{ end }}
{{ end }}
{{ end }}
{{ end }}
{{ end }}

{{- end -}}

